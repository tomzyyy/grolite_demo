<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grolite Demo</title>
<style>
:root{
  --bg:#0e1016;--panel:#171a23;--panel2:#1f2330;--line:#2a2f3c;--text:#eceff5;--muted:#9aa3b6;
  --accent:#8c9cf2;--accent-ink:#10131c;--accent-soft:rgba(140,156,242,.14);
  --good:#4cc38a;--bad:#ef6b7b;--warn:#f2b54c;
  --c-read:#2c5f66;--c-check:#1f7a52;--c-self:#b44a5d;--c-try:#6b55c2;
  --cream:#f7efe4;
  --radius:16px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6fa;--panel:#ffffff;--panel2:#f0f2f8;--line:#e2e5ee;--text:#171a23;--muted:#5d6577;
    --accent:#5466d8;--accent-ink:#ffffff;--accent-soft:rgba(84,102,216,.1);
  }
}
:root[data-theme="light"]{
  --bg:#f5f6fa;--panel:#ffffff;--panel2:#f0f2f8;--line:#e2e5ee;--text:#171a23;--muted:#5d6577;
  --accent:#5466d8;--accent-ink:#ffffff;--accent-soft:rgba(84,102,216,.1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.logo{font-weight:800;font-size:26px;color:var(--accent);letter-spacing:-.5px}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:99px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--text)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.count-card{background:var(--panel2);border-radius:14px;padding:14px 16px}
.count-card small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.count-card b{font-size:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.main{min-width:0;padding:34px 40px 120px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:32px;line-height:1.2;margin:0 0 6px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.muted{background:var(--panel2);color:var(--muted)}
.hero{border-radius:20px;padding:30px;background:linear-gradient(120deg,#3b5a7a,#5e7f8f 55%,#7d8f9b);color:#fff;margin-bottom:22px}
.hero h1{color:#fff}
.hero p{margin:0;opacity:.92}
.cont{display:grid;grid-template-columns:240px 1fr;gap:0;overflow:hidden;padding:0}
.cont .art{background:var(--cream);display:flex;align-items:center;justify-content:center}
.cont .body{padding:22px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.warn-box{background:rgba(242,181,76,.1);border:1px solid rgba(242,181,76,.35);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600}
.good-box{background:rgba(76,195,138,.1);border:1px solid rgba(76,195,138,.35);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
/* paper */
.phase{padding:0;overflow:hidden}
.phase-h{padding:18px 22px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.phase-h b{display:block}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:1px solid var(--line)}
.ch.live{cursor:pointer}
.ch.live:hover{background:var(--panel2)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
/* session list */
.act{display:grid;grid-template-columns:150px 1fr auto;align-items:stretch;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;min-height:84px}
.act:hover{border-color:var(--accent)}
.act .tag{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;text-transform:lowercase}
.act .tag span{font-weight:500;font-size:13px;opacity:.9}
.act .t{padding:14px 18px;display:flex;align-items:center;font-weight:700;font-size:17px}
.act .ck{display:flex;align-items:center;padding-right:20px}
.ck-i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.ck-i.on{background:var(--good);border-color:var(--good);color:#0e1016}
.t-read{background:var(--c-read)}.t-poll,.t-quiz{background:var(--c-check)}.t-explain,.t-recap{background:var(--c-self)}.t-try{background:var(--c-try)}
/* player */
.player{max-width:760px;margin:0 auto;position:relative}
.p-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.p-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.p-head{display:flex;justify-content:center;align-items:center;padding:14px;border-bottom:1px solid var(--line);font-weight:800;text-transform:lowercase;position:relative}
.p-head .pill{color:#fff;padding:3px 12px;border-radius:99px;font-size:14px}
.p-body{padding:28px 34px 34px}
.illo{width:300px;max-width:100%;aspect-ratio:1/1;margin:0 auto 22px;border-radius:16px;background:var(--cream);display:flex;align-items:center;justify-content:center}
.illo svg{width:86%;height:86%}
.p-body h2{font-size:24px;margin-bottom:6px}
.p-body p{font-size:17.5px;margin:0 0 14px}
.p-body ul,.p-body ol{font-size:17.5px;padding-left:22px;margin:0 0 14px}
.p-body li{margin-bottom:6px}
.keyidea{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 12px 12px 0;font-weight:600;margin:18px 0 0}
.tip{border-left:4px solid var(--warn);background:rgba(242,181,76,.09);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0 0;font-size:15.5px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;position:relative;overflow:hidden}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);transition:width .6s}
.opt .lbl{position:relative;display:flex;justify-content:space-between;gap:12px}
.opt.mine{border-color:var(--accent)}
.opt.right{border-color:var(--good)}
.opt.wrong{border-color:var(--bad)}
.feedback{border-radius:12px;padding:14px 16px;margin-top:6px;font-size:15.5px}
.feedback.ok{background:rgba(76,195,138,.12);border:1px solid rgba(76,195,138,.4)}
.feedback.no{background:rgba(239,107,123,.1);border:1px solid rgba(239,107,123,.4)}
.match-row{display:grid;grid-template-columns:1fr 220px 28px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}
textarea,input[type=text],input[type=date]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;width:100%}
textarea{min-height:120px;resize:vertical}
.post{background:var(--panel2);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--c-read);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.like{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 0}
.like.on{color:var(--bad)}
.tools{position:absolute;right:-78px;top:56px;display:flex;flex-direction:column;gap:12px}
.tool{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.tool:hover,.tool.on{border-color:var(--accent);color:var(--accent)}
.tool svg{width:24px;height:24px}
.p-foot{position:fixed;left:260px;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px 14px;z-index:5}
.p-foot .inner{max-width:760px;margin:0 auto}
.segs{display:flex;gap:6px;margin-top:10px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--panel2)}
.segs i.done{background:var(--accent);opacity:.55}
.segs i.cur{background:var(--accent)}
.navbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.navbtn.primary{background:var(--accent);color:var(--accent-ink)}
.navbtn:disabled{opacity:.35}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);z-index:20;padding:22px;display:flex;flex-direction:column;gap:14px;transform:translateX(100%);transition:transform .25s}
.drawer.open{transform:none}
.msg{padding:12px 14px;border-radius:14px;max-width:92%;font-size:15px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg.ai{background:var(--panel2);align-self:flex-start}
.suggest{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 12px;font-size:14px;text-align:left}
.suggest:hover{border-color:var(--accent)}
/* planner */
.stat{font-size:30px;font-weight:800}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.pchip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:8px 16px;font-weight:700;margin:0 8px 8px 0}
.pchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;justify-content:center}
.heat i{border-radius:3px;background:var(--panel2)}
.heat i.l1{background:rgba(140,156,242,.3)}.heat i.l2{background:rgba(140,156,242,.55)}.heat i.l3{background:rgba(140,156,242,.8)}.heat i.l4{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.mobnav{display:none}
.ws{position:relative;margin:0 0 14px}
.ws-btn{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.ws-btn:hover{border-color:var(--accent)}
.ws-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:#fff;font-weight:800;font-size:14px;flex:none}
.ws-name{flex:1;min-width:0}.ws-name b{display:block;font-size:15px}.ws-name small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:15;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ws-item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:9px 10px;text-align:left;font-weight:600;font-size:14.5px}
.ws-item:hover,.ws-item.on{background:var(--panel2)}
.ws-sep{height:1px;background:var(--line);margin:8px 0}
.course-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mob-ws{display:none}
.log{border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;background:var(--panel)}
.log-h{width:100%;display:grid;grid-template-columns:40px 1fr auto 28px;gap:14px;align-items:center;padding:16px 18px;border:0;background:none;text-align:left}
.log-h:hover{background:var(--panel2)}
.log-ic{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.log-ic.full{border-color:var(--good);color:var(--good)}
.chev{transition:transform .2s;color:var(--muted)}
.log.open .chev{transform:rotate(180deg)}
.log-body{border-top:1px solid var(--line);padding:18px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.metric{background:var(--panel2);border-radius:14px;padding:14px 10px;text-align:center}
.metric .mi{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.metric .mi svg{width:18px;height:18px}
.metric b{display:block;font-size:22px}
.metric span{font-size:12.5px;color:var(--muted)}
.li{display:grid;grid-template-columns:12px 84px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dot{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:7px}
.li .dot.on{background:var(--good)}
.li .tg{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;border-radius:6px;padding:3px 6px;text-align:center}
@media (max-width:820px){.metrics{grid-template-columns:repeat(2,1fr)}.li{grid-template-columns:12px 1fr}.li .tg{display:none}}
@media (max-width:820px){.mob-ws{display:block}}
@media (max-width:1100px){.tools{position:static;flex-direction:row;justify-content:center;margin-bottom:12px}.tool{width:46px;height:46px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:20px 16px 150px}
  .grid2,.grid3{grid-template-columns:1fr}
  .cont{grid-template-columns:1fr}
  .cont .art{height:180px}
  .act{grid-template-columns:96px 1fr auto}
  .act .tag{font-size:15px}
  .p-body{padding:22px 18px 26px}
  .p-foot{left:0;bottom:62px}
  .match-row{grid-template-columns:1fr 26px}
  .match-row select{grid-column:1/2}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--panel);border-top:1px solid var(--line);z-index:6;justify-content:space-around;align-items:center}
  .mobnav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  .mobnav button.on{color:var(--accent)}
  .mobnav svg{width:22px;height:22px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<nav class="mobnav" id="mobnav"></nav>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage ---------------- */
const KEY='grolite-demo-v1';
const DEFAULT=()=>({done:{},poll:null,quiz:{},match:null,posts:[],likes:{},notes:'',
  plan:{exam:null,hours:6.5,days:6,pace:'Average',papers:['AAAF','CS']},theme:null,finished:false,minutes:0,ws:'AAAF'});
let S;
try{S=Object.assign(DEFAULT(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=DEFAULT()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=new Date();today.setHours(0,0,0,0);
if(!S.plan.exam){const d=new Date(today);d.setDate(d.getDate()+27);S.plan.exam=d.toISOString().slice(0,10)}
if(S.theme)document.documentElement.dataset.theme=S.theme;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function daysLeft(){return Math.max(0,Math.round((new Date(S.plan.exam)-today)/864e5))}
const LEARNER='Seun';
function greet(){return 'Good evening'} // fixed for the evening demo
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------------- icons ---------------- */
const I={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',
plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h3M8 17h6"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
left:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>',

 const pace={Fast:.85,Average:1,'Takes time':1.2}[S.plan.pace];
 let req=S.plan.papers.reduce((a,c)=>a+PAPERS[c].hours,0)*pace;

function actBody(a,i){
 const h=`${illo(a.illo)}<h2>${a.title}</h2>`;
 switch(i){
 case 0:{const voted=S.poll!=null;const counts=POLL.base.map((c,k)=>c+(S.poll===k?1:0));const tot=counts.reduce((x,y)=>x+y,0);
  return `${h}<p>There’s no wrong answer here. Pick the one closest to what you believe right now. You’ll see how the rest of the cohort voted.</p><p><b>${POLL.q}</b></p>
  ${POLL.opts.map((o,k)=>{const p=Math.round(counts[k]/tot*100);return `<button class="opt ${voted&&S.poll===k?'mine':''}" ${voted?'disabled':''} data-poll="${k}"><span class="fill" style="width:${voted?p:0}%"></span><span class="lbl"><span>${o}</span>${voted?`<b>${p}%</b>`:''}</span></button>`}).join('')}
  ${voted?`<p class="small muted" style="text-align:center">Answered by ${tot} learners in the AAAF cohort. Keep your answer in mind: the next activities will show you which one is right.</p>`:''}`;}
 case 1:return `${h}<p>Imagine you’re buying a used car in Lagos. The seller says it’s in perfect condition. Do you just believe him? Most people bring their own mechanic to check it first. 🔧</p>
  <p>That mechanic gives you <b>assurance</b>: comfort that what someone else told you can be trusted.</p>
  <p>In professional terms, in an <b>assurance engagement</b> a practitioner:</p>
  <ol><li><b>is engaged by one party</b> (you hired the mechanic)</li><li><b>to give an opinion</b> (the mechanic’s verdict)</li><li><b>on information prepared by another party</b> (the seller’s claims about the car)</li></ol>
  <p>The opinion is an expression of assurance, or comfort, about the information that has been reviewed.</p>
  <div class="keyidea">Key idea: assurance is an independent opinion that adds comfort to information someone else prepared.</div>`;
 case 2:return `${h}<p>In most companies, the owners and the managers are different people. 🏢</p>
  <ul><li><b>Shareholders own</b> the company. This is <i>ownership</i>.</li><li><b>Directors run</b> it on their behalf. This is <i>stewardship</i>.</li></ul>
  <p>At year end, the directors prepare the financial statements: a report on how they managed the owners’ money. Would you accept a report card written by the student himself?</p>
  <p>That’s why shareholders don’t accept the financial statements without question. A <b>statutory audit</b> adds credibility: an independent auditor examines the statements and expresses an opinion.</p>
  <p>The opinion answers one question: are the financial statements prepared, <b>in all material respects</b>, in accordance with an applicable financial reporting framework such as IFRS?</p>
  <p>An audit is designed to give a <b>high level of assurance</b> to users of financial information. High, but not absolute.</p>
  <div class="keyidea">Key idea: audits exist because ownership (shareholders) and stewardship (directors) are separate.</div>`;
 case 4:return `${h}<p>Every assurance engagement, including an audit, has the same five elements. Here’s a memory hook: <b>3 people, 3 S’s, 1 report.</b></p>
  <ol><li><b>A three-party relationship</b>
   <ul><li><b>Practitioner:</b> the auditor or chartered accountant giving the opinion</li><li><b>Responsible party:</b> management or directors, who prepared the information</li><li><b>Intended user:</b> shareholders and others who rely on it</li></ul></li>
  <li><b>Subject matter:</b> what is being checked, such as the financial statements</li>
  <li><b>Suitable criteria:</b> the yardstick it’s measured against, such as IFRS</li>
  <li><b>Sufficient &amp; appropriate evidence:</b> enough proof (quantity) of good quality (quality)</li>
  <li><b>Assurance report:</b> the written opinion, such as the auditor’s report</li></ol>
  <div class="tip"><b>Exam tip:</b> ICAN often asks you to list and explain these. Learn the salient points word for word, then explain each one in your own words.</div>`;
 case 3:case 7:{const q=QUIZ[a.key];const ans=S.quiz[a.key];
  return `${h}<p><b>${q.q}</b></p>${q.opts.map((o,k)=>{let c='';if(ans!=null){if(o[1])c='right';else if(k===ans)c='wrong'}return `<button class="opt ${c}" ${ans!=null?'disabled':''} data-quiz="${a.key}" data-k="${k}"><span class="lbl"><span>${o[0]}</span>${ans!=null&&o[1]?I.check:''}</span></button>`}).join('')}
  ${ans!=null?`<div class="feedback ${q.opts[ans][1]?'ok':'no'}">${q.opts[ans][2]}${q.opts[ans][1]?'':`<br><br><b>The right answer:</b> ${q.opts.find(o=>o[1])[0]}`}</div>`:''}`;}
 case 5:{const m=S.match;
  return `${h}<p><b>Scenario:</b> Adire Fabrics Ltd is owned by 200 shareholders. Its directors prepare the year-end financial statements under IFRS, and Okafor &amp; Co. Chartered Accountants are hired to audit them.</p><p>Match each item to the element it represents.</p>
  ${MATCH.map((r,k)=>{const v=m?m.answers[k]:'';const ok=m&&v===r[1];return `<div class="match-row"><span class="small" style="font-size:15.5px">${r[0]}</span><select data-m="${k}" ${m?'disabled':''}><option value="">Choose…</option>${ELEMENTS.map(e=>`<option ${v===e?'selected':''}>${e}</option>`).join('')}</select><span style="color:${ok?'var(--good)':'var(--bad)'}">${m?(ok?I.check:'✕'):''}</span></div>`}).join('')}
  ${m?`<div class="feedback ${m.correct===MATCH.length?'ok':'no'}" style="margin-top:14px">You matched ${m.correct} of ${MATCH.length} correctly.${m.correct<MATCH.length?' Corrections: '+MATCH.filter((r,k)=>m.answers[k]!==r[1]).map(r=>`<b>${r[1]}</b> = ${r[0].split(',')[0].split(' who')[0]}`).join('; ')+'.':' Excellent: you can spot all five elements.'}</div><button class="btn ghost" style="margin-top:12px" data-retry-match>Try again</button>`:`<button class="btn" style="margin-top:16px" data-check-match>Check my answers</button>`}`;}
 case 6:return `${h}<p>Auditors don’t only report on financial statements. Your notes highlight two other areas.</p>
  <p><b>1. Opinions on other information in the annual report.</b> Your notes call these <i>non-assurance engagements</i>. Examples:</p>
  <ul><li>Corporate Social Responsibility (CSR) report</li><li>Environmental Impact Assessment report</li><li>Employment policy</li><li>Non-financial performance indicators (NFPIs)</li></ul>
  <p><b>2. Audit-related engagements:</b> work an accountant does that is related to, but not the same as, an audit:</p>
  <ul><li><b>Review of data:</b> checking information someone else prepared</li><li><b>Agreed-upon procedures:</b> the client chooses the checks, and the accountant reports what they found</li><li><b>Compilation:</b> the accountant prepares the information themselves</li></ul>
  <div class="keyidea">You’ll study these properly in Chapters 11 and 12. For now, just know they exist and how they differ.</div>`;
 case 8:{const mine=S.posts;
  return `${h}<p>Your friend says: <i>“Why waste money on auditors? The directors already prepared the accounts.”</i></p><p><b>In 2 or 3 sentences, how would you reply?</b> Use what you learned about ownership, stewardship and assurance.</p>
  <textarea id="explain" placeholder="Type your answer…"></textarea>
  <div class="row" style="margin:12px 0 24px"><button class="btn" data-post>Post to group wall</button><span class="small muted">Sharing is optional. You can continue without posting.</span></div>
  <div class="eyebrow" style="margin-bottom:10px">Group wall · AAAF cohort</div>
  ${[...mine.map(p=>({...p,init:'SE',name:LEARNER+' (you)',when:'just now',likes:0})),...SAMPLE_POSTS].map(p=>`<div class="post"><div class="row" style="margin-bottom:8px"><div class="avatar">${p.init}</div><div><b class="small">${esc(p.name)}</b><div class="small muted">${p.when}</div></div></div><div style="font-size:15.5px">${esc(p.text)}</div><button class="like ${S.likes[p.id]?'on':''}" data-like="${p.id}">♥ ${p.likes+(S.likes[p.id]?1:0)}</button></div>`).join('')}`;}
 case 9:{const pv=S.poll;
  return `${h}<ul><li><b>Assurance:</b> a practitioner, engaged by one party, gives an opinion on information prepared by another party.</li>
  <li><b>Why audits exist:</b> ownership (shareholders) and stewardship (directors) are separate, so owners need an independent opinion.</li>
  <li><b>What an audit gives:</b> a high, not absolute, level of assurance that the financial statements are prepared in all material respects under a framework such as IFRS.</li>
  <li><b>The 5 elements:</b> three parties, subject matter, suitable criteria, sufficient &amp; appropriate evidence, and a report. <i>3 people, 3 S’s, 1 report.</i></li>
  <li><b>Other work:</b> opinions on other annual report information, plus review, agreed-upon procedures and compilation.</li></ul>
  <div class="keyidea">Back to the opening poll: most of the cohort (41%) said an audit is mainly for catching fraud. The answer the course supports is <b>“an independent opinion on whether the accounts are fair”</b>${pv===1?', which is what you picked. Well done.':pv!=null?'. You’re not alone in thinking otherwise.':'.'} The gap between what the public expects of auditors and what they actually do has a name: the <b>expectation gap</b>. You’ll meet it in Chapter 4.</div>
  <p style="margin-top:18px"><b>What’s next:</b> Chapter 2, The Regulatory Environment. Who appoints, removes and regulates auditors in Nigeria under CAMA 2020?</p>
  <button class="btn block" data-finish>${S.finished?'Session complete ✓ Back to chapter':'Finish session'}</button>`;}
 }
}

  <span><span class="small muted">${e.when} · ${e.mins} min</span><b style="display:block">${esc(e.title)}</b><span class="small muted">${e.total} activities · ${e.done}/${e.total} done</span><div class="bar" style="margin-top:8px;height:6px"><i style="width:${pct}%;background:var(--good)"></i></div></span>
  <b style="color:${pct===100?'var(--good)':'var(--text)'}">${pct}%</b><span class="chev">▾</span></button>
  ${open?`<div class="log-body">${e.sample?'<div class="small muted" style="margin-bottom:10px">Sample history for the demo.</div>':''}
   <div class="eyebrow" style="margin-bottom:10px">Activity metrics</div>
   <div class="metrics">${e.metrics.map(m=>`<div class="metric"><div class="mi" style="background:${m[1]}33;color:${m[1]}">${m[0]}</div><b>${m[2]}</b><span>${m[3]}</span></div>`).join('')}</div>
   <div class="eyebrow" style="margin-bottom:4px">What you did</div>
   ${e.items.map((it,k)=>`<div class="li"><span class="dot ${it.done?'on':''}"></span><span class="tg t-${it.type}">${TAGNAME[it.type]}</span><div><b style="font-size:15px">${k+1}. ${esc(it.title)}</b><div class="small muted">${esc(it.detail)}</div></div></div>`).join('')}
   ${e.id==='s1'?`<button class="btn ghost" style="margin-top:12px" data-go="session">Open this session</button>`:''}</div>`:''}</div>`;
}

function vSettings(){
 return `<div class="wrap"><h1>Settings</h1><p class="sub">Demo controls.</p>
 <div class="card stack"><div class="row between"><div><b>Theme</b><div class="small muted">Switch between dark and light.</div></div><button class="btn ghost" data-theme>${I.sun} Toggle theme</button></div>
 <div class="row between"><div><b>Reset demo</b><div class="small muted">Clears progress, answers and posts so you can present it fresh.</div></div><button class="btn ghost" data-reset>Reset</button></div>
 <div class="small muted">Grolite demo · lesson content adapted from AAA study notes (Chapter 1) for demonstration only. All students, cohort numbers and other papers’ data are sample data.</div></div></div>`;
}

/* ---------------- drawer: notes + AI tutor ---------------- */
const AI={
 'Explain assurance like I’m new to this':'Think of assurance as a trusted second opinion. Someone else prepared some information (the directors prepared the accounts). You hire an independent expert (the auditor) to check it and tell you whether you can rely on it. That opinion gives you comfort, which is what “assurance” means.',
 'What’s the difference between an audit and a review?':'An audit gives a high level of assurance and involves detailed testing. A review of data involves less work and gives a moderate (limited) level of assurance. You’ll go deeper in Chapter 11.',
 'Give me a memory trick for the 5 elements':'Try “3 people, 3 S’s, 1 report”. The 3 people are the practitioner, responsible party and intended user. The 3 S’s are Subject matter, Suitable criteria and Sufficient & appropriate evidence. Then 1 assurance report.'
};
let chat=[];
function openDrawer(kind){
 const d=document.getElementById('drawer');
 if(kind==='courses'){d.innerHTML=`<div class="row between"><h2 style="margin:0">Add a course</h2><button class="navbtn" data-close>${I.x}</button></div>
  <div class="small muted">Courses you sign up for appear as learner workspaces in your sidebar, and their hours are added to your Study Plan.</div>
  <div style="overflow:auto">${Object.keys(PAPERS).map(k=>`<div class="course-row">${badge(k,36)}<div style="flex:1"><b>${k}</b><div class="small muted">${PAPERS[k].name} · ~${PAPERS[k].hours}h</div></div>${S.plan.papers.includes(k)?'<span class="chip">Enrolled ✓</span>':`<button class="btn" data-enroll="${k}">Enroll</button>`}</div>`).join('')}</div>`;d.classList.add('open');return}
 if(kind==='notes'){d.innerHTML=`<div class="row between"><h2 style="margin:0">My notes</h2><button class="navbtn" data-close>${I.x}</button></div><div class="small muted">AAAF · Ch 1: Meaning of Audit and Assurance</div><textarea id="notes" style="flex:1" placeholder="Jot down tricky bits, definitions, memory tricks…">${esc(S.notes)}</textarea><div class="small muted">Saved automatically.</div>`}
 else{d.innerHTML=`<div class="row between"><h2 style="margin:0">Ask Grolite</h2><button class="navbtn" data-close>${I.x}</button></div><div class="small muted">AI study tutor for this chapter. Demo: suggested questions have prepared answers.</div>
  <div id="chat" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px">${chat.map(m=>`<div class="msg ${m[0]}">${esc(m[1])}</div>`).join('')||`<div class="msg ai">Hi ${LEARNER}. Ask me anything about Chapter 1.</div>`}</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">${Object.keys(AI).map(q=>`<button class="suggest" data-ask="${esc(q)}">${q}</button>`).join('')}</div>
  <div class="row"><input type="text" id="aiq" placeholder="Type a question…"><button class="btn" data-askfree>Ask</button></div>`}
 d.classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}

/* speech */
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}const b=document.getElementById('listen');if(b)b.classList.remove('on')}

/* ---------------- render + events ---------------- */
function render(){
 document.getElementById('side').innerHTML=sideHTML();
 document.getElementById('mobnav').innerHTML=mobHTML();
 if(!S.plan.papers.includes(S.ws))S.ws=S.plan.papers[0];
 if(S.ws!=='AAAF'&&['session','play'].includes(route))route='paper';
 document.getElementById('side').innerHTML=sideHTML();
 const v={home:vHome,paper:vPaper,session:vSession,play:vPlay,planner:vPlanner,progress:vProgress,settings:vSettings}[route];
 document.getElementById('main').innerHTML=(['home','paper'].includes(route)?`<div class="mob-ws wrap">${wsSwitch()}</div>`:'')+v();
}
function markDone(i){if(!S.done[i]){S.done[i]=true;S.minutes=(S.minutes||0)+SESSION.acts[i].min}save()}

document.addEventListener('click',e=>{
 if(wsOpen&&!e.target.closest('.ws')){wsOpen=false;render()}
 const t=e.target.closest('button,[data-go],[data-play]');if(!t)return;const ds=t.dataset;
 if('wsmenu' in ds){wsOpen=!wsOpen;render();return}
 if(ds.log){openLog[ds.log]=!openLog[ds.log];render();return}
 if(ds.ws){wsOpen=false;S.ws=ds.ws;save();go(['home','paper'].includes(route)?route:'home');toast(`Switched to ${PAPERS[ds.ws].name}`);return}
 if('addcourse' in ds){wsOpen=false;render();openDrawer('courses');return}
 if(ds.enroll){S.plan.papers.push(ds.enroll);S.ws=ds.enroll;save();go('home');toast(`Enrolled in ${PAPERS[ds.enroll].name}`);return}
 if(ds.go){if(ds.go==='continue'&&S.ws!=='AAAF'){go('paper');return}
  if(ds.go==='continue'){const first=SESSION.acts.findIndex((_,i)=>!S.done[i]);go('play',first<0?SESSION.acts.length-1:first)}else go(ds.go);return}
 if(ds.play!=null){go('play',+ds.play);return}
 if('next' in ds){if(['read','recap'].includes(SESSION.acts[step].type))markDone(step);go('play',step+1);return}
 if('prev' in ds){go('play',step-1);return}
 if(ds.poll!=null){S.poll=+ds.poll;markDone(0);render();return}
 if(ds.quiz){S.quiz[ds.quiz]=+ds.k;markDone(step);render();if(QUIZ[ds.quiz].opts[+ds.k][1])toast('Correct! Nice work.');return}
 if('checkMatch' in ds){const answers=MATCH.map((_,k)=>document.querySelector(`[data-m="${k}"]`).value);if(answers.some(a=>!a)){toast('Match every item first.');return}
  S.match={answers,correct:answers.filter((a,k)=>a===MATCH[k][1]).length};markDone(5);render();return}
 if('retryMatch' in ds){S.match=null;render();return}
 if('post' in ds){const v=document.getElementById('explain').value.trim();if(!v){toast('Write your answer first.');return}S.posts.unshift({id:'u'+Date.now(),text:v});markDone(8);render();toast('Posted to your group wall');return}
 if(ds.like){S.likes[ds.like]=!S.likes[ds.like];save();render();return}
 if('finish' in ds){markDone(9);SESSION.acts.forEach((_,i)=>{if(!S.done[i])S.done[i]=true});S.finished=true;save();go('session');toast('Session complete! Ch 1 marked as read automatically.');return}
 if(ds.drawer){openDrawer(ds.drawer);return}
 if('close' in ds){closeDrawer();return}
 if(ds.ask){chat.push(['me',ds.ask],['ai',AI[ds.ask]]);openDrawer('ai');return}
 if('askfree' in ds){const q=document.getElementById('aiq').value.trim();if(!q)return;chat.push(['me',q],['ai','In the full product, this connects to an AI tutor grounded in your study material and reviewed by an accountant. In this demo, try one of the suggested questions.']);openDrawer('ai');return}
 if('listen' in ds){if(speechSynthesis.speaking){stopSpeech();return}const txt=document.getElementById('pbody').innerText;const u=new SpeechSynthesisUtterance(txt);u.rate=.98;u.onend=()=>t.classList.remove('on');speechSynthesis.speak(u);t.classList.add('on');return}
 if(ds.h){S.plan.hours=Math.min(14,Math.max(1,S.plan.hours+ +ds.h));save();render();return}
 if(ds.d){S.plan.days=Math.min(7,Math.max(1,S.plan.days+ +ds.d));save();render();return}
 if(ds.pace){S.plan.pace=ds.pace;save();render();return}
 if(ds.paper){const p=S.plan.papers;const i=p.indexOf(ds.paper);if(i>=0){if(p.length===1){toast('Keep at least one paper.');return}p.splice(i,1)}else p.push(ds.paper);save();render();return}
 if('theme' in ds){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');S.theme=cur==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save();return}
 if('reset' in ds){const th=S.theme;S=DEFAULT();S.theme=th;const d=new Date(today);d.setDate(d.getDate()+27);S.plan.exam=d.toISOString().slice(0,10);chat=[];save();go('home');toast('Demo reset');return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='notes'){S.notes=e.target.value;save()}
 if(e.target.id==='exam'&&e.target.value){S.plan.exam=e.target.value;save();render()}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='aiq'&&e.key==='Enter'){document.querySelector('[data-askfree]').click()}
 if(route==='play'&&!['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)){if(e.key==='ArrowRight'&&step<SESSION.acts.length-1)document.querySelector('[data-next]').click();if(e.key==='ArrowLeft'&&step>0)go('play',step-1)}
});
render();
</script>
</body>
</html>
